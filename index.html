<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe6">
<meta name="description" content="Restaurants, receptes, vins, botigues i experiències que fan venir salivera.">
<title>Fa venir Salivera · Biblioteca personal</title>
<style>
:root{
 --bg:#f6efe6;--paper:#fffdf9;--ink:#2f241f;--muted:#786a63;--line:#e7dbd0;
 --accent:#985b45;--wine:#704555;--green:#687766;--gold:#ad8143;--blue:#53717d;
 --shadow:0 12px 34px rgba(50,34,27,.09)
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}.hidden{display:none!important}
.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:86px}
header{position:sticky;top:0;z-index:30;padding:13px 15px 10px;background:rgba(246,239,230,.94);backdrop-filter:blur(15px)}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.brand-left{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:14px;background:var(--accent);color:white;display:grid;place-items:center;font-size:22px}
.brand-name{line-height:.9}.brand-prefix{display:block;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}.brand strong{display:block;font-family:Georgia,serif;font-size:25px;font-weight:600;letter-spacing:.03em}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.heart{border:1px solid var(--line);background:var(--paper);border-radius:13px;width:41px;height:41px;font-size:20px}
.search{position:relative}.search input{width:100%;height:52px;border:1px solid var(--line);border-radius:17px;background:var(--paper);padding:0 45px;font-size:16px;outline:none;box-shadow:0 5px 18px rgba(55,38,30,.05)}
.search .glass{position:absolute;left:16px;top:14px;font-size:19px;color:var(--muted)}.search .x{position:absolute;right:8px;top:8px;border:0;background:transparent;width:36px;height:36px;font-size:20px;color:var(--muted)}
main{padding:8px 15px 30px}.hero{padding:13px 3px 10px}.eyebrow{font-size:11px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.12em}
h1{font-family:Georgia,serif;font-size:35px;font-weight:500;line-height:1.05;margin:7px 0 8px}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.module-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.module{border:1px solid var(--line);background:var(--paper);border-radius:20px;min-height:112px;padding:15px;text-align:left;position:relative;box-shadow:0 5px 18px rgba(55,38,30,.04)}
.module .icon{font-size:27px;display:block;margin-bottom:12px}.module b{display:block;font-size:15px}.module small{display:block;color:var(--muted);margin-top:3px;font-size:11px}
.module .count{position:absolute;right:12px;top:12px;border-radius:999px;padding:4px 7px;background:var(--bg);font-size:10px;color:var(--muted)}
.module.main{grid-column:1/-1;min-height:138px;background:linear-gradient(135deg,var(--accent),#744132);color:white;border:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.module.main .icon{font-size:41px;margin:0}.module.main b{font-family:Georgia,serif;font-size:26px;font-weight:500}.module.main small{color:rgba(255,255,255,.78);font-size:12px}.module.main .count{background:rgba(255,255,255,.16);color:white}.module.main .go{font-size:25px}
.module.pending{opacity:.72}.module.pending:after{content:"Pendent d’importar";position:absolute;bottom:11px;right:11px;font-size:9px;color:var(--muted);background:var(--bg);padding:4px 6px;border-radius:999px}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:25px 2px 10px}.section-title h2{font-family:Georgia,serif;font-size:25px;font-weight:500;margin:0}.section-title small{color:var(--muted)}
.global-results{display:grid;gap:16px}.group h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.result-card{display:grid;grid-template-columns:72px 1fr;min-height:88px;background:var(--paper);border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:8px}
.thumb{background:#e8ddd3 center/cover no-repeat}.result-info{padding:11px;min-width:0}.result-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-info small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.kind{display:inline-block;margin-top:7px;font-size:9px;border-radius:999px;background:var(--bg);padding:4px 6px;color:var(--accent);font-weight:800;text-transform:uppercase}
.view{padding-top:4px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:9px;position:sticky;top:116px;z-index:20;padding:10px 0;background:linear-gradient(var(--bg) 82%,transparent)}
.toolbar h2{font-family:Georgia,serif;font-size:25px;font-weight:500;margin:0}.toolbar small{display:block;color:var(--muted);font-size:11px}
.filter{border:0;background:var(--ink);color:white;border-radius:14px;padding:11px 14px;font-weight:750}
.cards{display:grid;gap:10px}.card{display:grid;grid-template-columns:105px 1fr;background:var(--paper);border:1px solid var(--line);border-radius:19px;overflow:hidden;min-height:126px}
.photo{background:#e8ddd3 center/cover no-repeat}.body{padding:12px;min-width:0}.body h3{font-family:Georgia,serif;font-size:20px;font-weight:500;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc{font-size:11px;color:var(--accent);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:11px;margin-top:7px;line-height:1.35}.open{border:0;background:transparent;color:var(--accent);font-size:11px;font-weight:800;padding:8px 0 0}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:18px;padding:35px 18px;text-align:center;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(780px,100%);height:74px;background:rgba(255,253,249,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(4,1fr);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.bottom button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:750}.bottom span{display:block;font-size:20px;margin-bottom:3px}.bottom .active{color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(35,24,20,.55);z-index:60;display:none;align-items:flex-end}.overlay.open{display:flex}.drawer{width:min(780px,100%);margin:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:13px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.handle{width:42px;height:5px;background:#d7cabf;border-radius:99px;margin:0 auto 14px}.drawer h2{font-family:Georgia,serif;font-size:27px;font-weight:500;margin:0 0 14px}
.fields{display:grid;gap:11px}.field label{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.field select{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:12px}
.apply{width:100%;border:0;background:var(--accent);color:white;border-radius:14px;padding:14px;font-weight:800;margin-top:15px}
.detail{position:fixed;inset:0;background:rgba(35,24,20,.56);z-index:70;display:none;align-items:flex-end}.detail.open{display:flex}.sheet{width:min(780px,100%);margin:auto;background:var(--paper);border-radius:27px 27px 0 0;max-height:94vh;overflow:auto}.heroimg{height:230px;background:#e8ddd3 center/cover no-repeat;position:relative}.close{position:absolute;right:13px;top:13px;border:0;background:rgba(255,255,255,.93);width:39px;height:39px;border-radius:50%;font-size:20px}.detailbody{padding:20px}.detailbody h2{font-family:Georgia,serif;font-weight:500;font-size:30px;margin:4px 0 5px}.info{border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:8px;font-size:12px}.info small{display:block;color:var(--muted);margin-bottom:3px}
@media(min-width:640px){header,main{padding-left:24px;padding-right:24px}.cards{grid-template-columns:1fr 1fr}.module-grid{grid-template-columns:repeat(4,1fr)}.module.main{grid-column:1/-1}.result-card{grid-template-columns:90px 1fr}}

.recipe-stats{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px}.detail-section{margin-top:22px}.detail-section h3{font-family:Georgia,serif;font-size:21px;font-weight:500;margin:0 0 9px}.detail-text{white-space:pre-line;line-height:1.6;font-size:14px}.narrative{padding:15px 16px;background:#f4e9df;border-left:4px solid var(--accent);border-radius:0 14px 14px 0;font-family:Georgia,serif;font-size:16px;line-height:1.5}.wine-intro{padding:18px;background:var(--paper);border:1px solid var(--line);border-radius:20px}.wine-intro h3{font-family:Georgia,serif;font-size:24px;font-weight:500;margin:0 0 8px}.wine-intro p{color:var(--muted);line-height:1.55;margin:0}.do-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.do-pill{padding:13px;background:var(--paper);border:1px solid var(--line);border-radius:15px;font-size:13px;font-weight:700}.external-link{display:inline-block;margin-top:12px;color:white;background:var(--accent);text-decoration:none;padding:10px 13px;border-radius:12px;font-weight:750;font-size:13px}

.status-badge{display:inline-block;margin-top:7px;margin-right:6px;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800}.status-temporal{background:#fff2c9;color:#755600}.status-tancat{background:#f9d8d3;color:#8b3025}.closed-card .photo{filter:grayscale(.55);opacity:.78}.status-notice{margin:14px 0;padding:14px;border-radius:14px;display:grid;gap:5px;font-size:13px}.status-notice b{font-size:15px}.status-notice span,.status-notice small{color:var(--muted)}.status-notice p{margin:2px 0}.rating-summary{border:1px solid var(--line);border-radius:17px;padding:14px;background:var(--bg)}.rating-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rating-main>span{font-size:11px;text-transform:uppercase;font-weight:800;color:var(--muted)}.rating-main small{width:100%;color:var(--muted)}.stars{letter-spacing:1px;color:var(--gold);white-space:nowrap}.rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.rating-grid>div{background:var(--paper);padding:10px;border-radius:12px}.rating-grid span:first-child{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.return-rate{margin-top:12px;font-weight:750}.rating-entry{border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:10px}.rating-head{display:flex;justify-content:space-between;gap:10px}.rating-head small{display:block;color:var(--muted);margin-top:2px}.own-tag{background:var(--accent);color:white;padding:4px 7px;border-radius:999px;font-size:9px}.mini-ratings{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.mini-ratings>span{font-size:10px;background:var(--bg);padding:5px 7px;border-radius:8px}.mini-ratings .stars{font-size:10px}.mini-ratings b{font-size:10px}.would-return{margin-top:9px;font-size:12px;font-weight:700}.rating-entry p,.visit p{margin:9px 0 0;line-height:1.45}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.gallery img{width:100%;aspect-ratio:1.25;object-fit:cover;border-radius:13px}.visit{display:grid;gap:5px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}.visit span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="brand-left"><div class="mark">◡</div><div class="brand-name"><span class="brand-prefix">fa venir</span><strong>SALIVERA</strong><small>La teva biblioteca personal</small></div></div><button class="heart" aria-label="Preferits">♡</button></div>
 <div class="search"><span class="glass">⌕</span><input id="globalSearch" placeholder="Busca un lloc, un plat, un vi..."><button id="clear" class="x hidden">×</button></div>
</header>
<main>
 <section id="home">
  <div class="hero"><div class="eyebrow">Tot allò que val la pena recordar</div><h1 id="greeting">Bon dia!</h1><p>Què et ve de gust descobrir avui?</p></div>
  <div class="module-grid">
   <button class="module main" data-module="restaurant"><span class="icon">🍴</span><span><b>Restaurants</b><small>La teva col·lecció de restaurants</small></span><span class="go">→</span><span class="count" id="countRestaurant"></span></button>
   <button class="module" data-module="recepta"><span class="icon">👨‍🍳</span><b>Receptes</b><small>Què cuinar</small><span class="count" id="countRecepta"></span></button>
   <button class="module pending" data-module="vi"><span class="icon">🍷</span><b>Vins</b><small>DO catalanes</small><span class="count">—</span></button>
   <button class="module" data-module="botiga"><span class="icon">🛍️</span><b>Botigues</b><small>On comprar</small><span class="count" id="countBotiga"></span></button>
   <button class="module" data-module="experiencia"><span class="icon">✨</span><b>Experiències</b><small>Què descobrir</small><span class="count" id="countExperiencia"></span></button>
  </div>
  <div id="globalArea" class="hidden"><div class="section-title"><h2>Resultats globals</h2><small id="globalCount"></small></div><div id="globalResults" class="global-results"></div></div>
 </section>

 <section id="moduleView" class="view hidden">
  <div class="toolbar"><div><h2 id="moduleTitle"></h2><small id="moduleSubtitle"></small></div><button class="filter" id="filterBtn">☰ Filtres</button></div>
  <div id="cards" class="cards"></div>
 </section>
</main>
</div>
<nav class="bottom">
 <button class="active" data-nav="home"><span>⌂</span>Inici</button>
 <button data-nav="search"><span>⌕</span>Cercar</button>
 <button data-nav="favorites"><span>♡</span>Preferits</button>
 <button data-nav="history"><span>◷</span>Historial</button>
</nav>

<div class="overlay" id="filters">
 <div class="drawer"><div class="handle"></div><h2>Filtres</h2>
  <div class="fields">
   <div class="field"><label id="regionLabel">Vegueria</label><select id="region"><option value="">Totes</option></select></div>
   <div class="field"><label id="zoneLabel">Zona</label><select id="zone"><option value="">Totes</option></select></div>
   <div class="field" id="cuisineField"><label id="cuisineLabel">Cuina</label><select id="cuisine"><option value="">Totes</option></select></div>
   <div class="field"><label id="specialtyLabel">Tipus / especialitat</label><select id="specialty"><option value="">Totes</option></select></div>
   <div class="field" id="statusField"><label>Estat</label><select id="status"><option value="actiu">Només actius</option><option value="temporal">Tancats temporalment</option><option value="tancat">Tancats definitivament</option><option value="tots">Tots els estats</option></select></div>
  </div>
  <button class="apply" id="apply">Veure resultats</button>
 </div>
</div>

<div class="detail" id="detail"><article class="sheet"><div class="heroimg" id="heroimg"><button class="close" id="close">×</button></div><div class="detailbody" id="detailbody"></div></article></div>

<script src="data.js"></script>
<script>
const rawData=window.ONANEM_DATA||[], $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const uniq=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ca'));
const asArray=v=>Array.isArray(v)?v:(v?[v]:[]);
const clamp5=n=>Math.max(0,Math.min(5,Number(n)||0));
const data=rawData.map(p=>({
  estat:'actiu', categories:[], imatges:[], recomanacions:[], visites:[], ...p,
  categories:asArray(p.categories?.length?p.categories:[...(p.cuines||[]),...(p.especialitats||[])]),
  imatges:asArray(p.imatges), recomanacions:asArray(p.recomanacions), visites:asArray(p.visites)
}));
let current='restaurant', filters={region:'',zone:'',cuisine:'',specialty:'',status:'actiu'};
const labels={restaurant:['Restaurants','On menjar'],recepta:['Receptes','Què cuinar'],botiga:['Botigues','On comprar'],experiencia:['Experiències','Què descobrir'],vi:['Vins','Denominacions d’origen catalanes']};
const icons={restaurant:'🍴',botiga:'🛍️',experiencia:'✨',recepta:'👨‍🍳',vi:'🍷'};
const wineDOs=['DO Alella','DO Catalunya','DO Cava','DO Conca de Barberà','DO Costers del Segre','DO Empordà','DO Montsant','DO Penedès','DO Pla de Bages','DOQ Priorat','DO Tarragona','DO Terra Alta'];
const statusInfo={
  actiu:{label:'Actiu',icon:'🟢'},
  temporal:{label:'Tancat temporalment',icon:'🟡'},
  tancat:{label:'Tancat definitivament',icon:'🔴'}
};
function getStatus(p){return statusInfo[p.estat]||statusInfo.actiu}
function loc(p){if(p.tipus==='recepta')return [p.categoria,p.tipusAliment].filter(Boolean).join(' · ');return [p.zona,p.vegueria&&p.vegueria!=='...Altres'?p.vegueria:p.pais].filter(Boolean).join(' · ')}
function searchable(p){return norm([p.nom,p.zona,p.vegueria,p.pais,p.adreca,p.notes,p.rang,p.recomanatPer,p.categoria,p.tipusAliment,p.cuiner,p.cuina,p.dificultat,p.ingredients,p.preparacio,p.narracio,p.estat,...asArray(p.categories),...asArray(p.allergens),...asArray(p.cuines),...asArray(p.especialitats),...asArray(p.serveis),...asArray(p.recomanacions).flatMap(r=>[r.nom,r.comentari])].join(' '))}
function moduleData(type){return data.filter(x=>x.tipus===type)}
function counts(){$('#countRestaurant').textContent=moduleData('restaurant').length;$('#countRecepta').textContent=moduleData('recepta').length;$('#countBotiga').textContent=moduleData('botiga').length;$('#countExperiencia').textContent=moduleData('experiencia').length}
function statusBadge(p){const s=getStatus(p);return p.estat&&p.estat!=='actiu'?`<span class="status-badge status-${esc(p.estat)}">${s.icon} ${s.label}</span>`:''}
function globalSearch(q){const area=$('#globalArea'),out=$('#globalResults');if(!q.trim()){area.classList.add('hidden');out.innerHTML='';return}const nq=norm(q),types=['restaurant','recepta','botiga','experiencia'];const groups=types.map(type=>[type,moduleData(type).filter(p=>searchable(p).includes(nq))]).filter(([,x])=>x.length);const total=groups.reduce((n,[,x])=>n+x.length,0);area.classList.remove('hidden');$('#globalCount').textContent=`${total} resultats`;out.innerHTML=groups.length?groups.map(([type,list])=>`<section class="group"><h3>${icons[type]} ${labels[type][0]} (${list.length})</h3>${list.slice(0,6).map(resultCard).join('')}${list.length>6?`<button class="open" data-more="${type}">Veure'n ${list.length} →</button>`:''}</section>`).join(''):`<div class="empty">No hi ha cap coincidència a les dades importades.</div>`;bindOpen();$$('[data-more]').forEach(b=>b.onclick=()=>openModule(b.dataset.more,q))}
function resultCard(p){const img=p.imatge||p.logo||p.imatges?.[0]||'';return `<article class="result-card" data-open="${esc(p.id)}"><div class="thumb" style="${img?`background-image:url('${esc(img)}')`:''}"></div><div class="result-info"><b>${esc(p.nom)}</b><small>${esc(loc(p))}</small>${statusBadge(p)}<span class="kind">${icons[p.tipus]} ${esc(labels[p.tipus]?.[0]||p.tipus)}</span></div></article>`}
function recipeFilters(arr){$('#regionLabel').textContent='Categoria';$('#zoneLabel').textContent='Tipus d’aliment';$('#cuisineLabel').textContent='Cuiner';$('#specialtyLabel').textContent='Dificultat';fill('#region',uniq(arr.map(p=>p.categoria)),filters.region);fill('#zone',uniq(arr.map(p=>p.tipusAliment)),filters.zone);fill('#cuisine',uniq(arr.map(p=>p.cuiner)),filters.cuisine);fill('#specialty',uniq(arr.map(p=>p.dificultat)),filters.specialty)}
function standardFilters(arr){$('#regionLabel').textContent=current==='restaurant'?'Vegueria':'Territori';$('#zoneLabel').textContent='Zona';$('#cuisineLabel').textContent='Cuina';$('#specialtyLabel').textContent=current==='restaurant'?'Categoria / especialitat':'Tipus / especialitat';const r=uniq(arr.map(p=>p.territori==='altres'?p.pais:p.vegueria));fill('#region',r,filters.region);const zarr=filters.region?arr.filter(p=>(p.territori==='altres'?p.pais:p.vegueria)===filters.region):arr;fill('#zone',uniq(zarr.map(p=>p.zona)),filters.zone);fill('#cuisine',uniq(arr.flatMap(p=>p.cuines||[])),filters.cuisine);fill('#specialty',uniq(arr.flatMap(p=>p.categories?.length?p.categories:(p.especialitats||[]))),filters.specialty)}
function populateFilters(){const arr=moduleData(current);current==='recepta'?recipeFilters(arr):standardFilters(arr);$('#cuisineField').classList.toggle('hidden',!['restaurant','recepta'].includes(current));$('#statusField').classList.toggle('hidden',!['restaurant','botiga','experiencia'].includes(current));$('#status').value=filters.status}
function fill(id,vals,val){$(id).innerHTML='<option value="">Totes</option>'+vals.map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('')}
function filtered(q=''){const nq=norm(q);return moduleData(current).filter(p=>{const statusOk=current==='recepta'||!filters.status||(filters.status==='tots'?true:p.estat===filters.status);const ok=current==='recepta'?(!filters.region||p.categoria===filters.region)&&(!filters.zone||p.tipusAliment===filters.zone)&&(!filters.cuisine||p.cuiner===filters.cuisine)&&(!filters.specialty||p.dificultat===filters.specialty):(!filters.region||(p.territori==='altres'?p.pais:p.vegueria)===filters.region)&&(!filters.zone||p.zona===filters.zone)&&(!filters.cuisine||(p.cuines||[]).includes(filters.cuisine))&&(!filters.specialty||(p.categories||[]).includes(filters.specialty));return statusOk&&ok&&(!nq||searchable(p).includes(nq))})}
function openModule(type,q=''){if(type==='vi'){openWineModule();return}current=type;filters={region:'',zone:'',cuisine:'',specialty:'',status:type==='recepta'?'tots':'actiu'};$('#home').classList.add('hidden');$('#moduleView').classList.remove('hidden');$('#moduleTitle').textContent=labels[type][0];$('#moduleSubtitle').textContent=labels[type][1];$('#filterBtn').classList.remove('hidden');populateFilters();renderModule(q);window.scrollTo({top:0,behavior:'smooth'})}
function openWineModule(){current='vi';$('#home').classList.add('hidden');$('#moduleView').classList.remove('hidden');$('#moduleTitle').textContent='Vins';$('#moduleSubtitle').textContent='Estructura inicial per denominacions d’origen';$('#filterBtn').classList.add('hidden');$('#cards').innerHTML=`<section class="wine-intro"><h3>🍷 Vins catalans</h3><p>Aquest mòdul quedarà organitzat per denominació d’origen. Els vins tindran vida pròpia i les relacions amb restaurants o receptes seran sempre opcionals.</p><div class="do-grid">${wineDOs.map(x=>`<div class="do-pill">${esc(x)}</div>`).join('')}</div></section>`;window.scrollTo({top:0,behavior:'smooth'})}
function renderModule(q=''){const list=filtered(q);$('#moduleSubtitle').textContent=`${labels[current][1]} · ${list.length} resultats`;$('#cards').innerHTML=list.length?list.map(card).join(''):`<div class="empty">No hi ha resultats amb aquesta combinació.</div>`;bindOpen()}
function card(p){const img=p.imatge||p.logo||p.imatges?.[0]||'',meta=p.tipus==='recepta'?[p.cuiner,p.dificultat,p.temps?`${p.temps} min`:null].filter(Boolean).join(' · '):[...(p.cuines||[]),...(p.categories||[])].slice(0,3).join(' · ')||p.notes||'';return `<article class="card ${p.estat!=='actiu'?'closed-card':''}"><div class="photo" style="${img?`background-image:url('${esc(img)}')`:''}"></div><div class="body"><h3>${esc(p.nom)}</h3><div class="loc">${p.tipus==='recepta'?'🍽️':'📍'} ${esc(loc(p))}</div>${statusBadge(p)}<div class="meta">${esc(meta)}</div><button class="open" data-open="${esc(p.id)}">Veure fitxa →</button></div></article>`}
function bindOpen(){$$('[data-open]').forEach(el=>el.onclick=()=>showDetail(data.find(x=>x.id===el.dataset.open)))}
function stars(n){const v=clamp5(n);return `<span class="stars" aria-label="${v} de 5">${'★'.repeat(Math.round(v))}${'☆'.repeat(5-Math.round(v))}</span><b>${v?v.toFixed(1).replace('.',','):''}</b>`}
function allRatings(p){const own=p.valoracio?[{nom:'La meva valoració',...p.valoracio,propia:true}]:[];return [...own,...asArray(p.recomanacions)]}
function averageRatings(p){const rs=allRatings(p);const keys=['menjar','servei','local','preu'];const avg={};keys.forEach(k=>{const vals=rs.map(r=>Number(r[k])).filter(v=>v>0);avg[k]=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0});const all=keys.flatMap(k=>rs.map(r=>Number(r[k])).filter(v=>v>0));avg.general=all.length?all.reduce((a,b)=>a+b,0)/all.length:0;const tornaria=rs.map(r=>r.tornaria).filter(Boolean);avg.tornaria=tornaria.length?Math.round(tornaria.filter(x=>x==='segur'||x===true).length/tornaria.length*100):null;return avg}
function ratingSummary(p){const rs=allRatings(p);if(!rs.length)return '';const a=averageRatings(p);return `<section class="detail-section"><h3>Valoracions</h3><div class="rating-summary"><div class="rating-main"><span>Mitjana</span>${stars(a.general)}<small>${rs.length} ${rs.length===1?'valoració':'valoracions'}</small></div><div class="rating-grid">${[['🍽️','Menjar','menjar'],['😊','Servei','servei'],['🏠','Local','local'],['💰','Qualitat-preu','preu']].map(([i,l,k])=>a[k]?`<div><span>${i} ${l}</span>${stars(a[k])}</div>`:'').join('')}</div>${a.tornaria!==null?`<div class="return-rate">❤️ El ${a.tornaria}% hi tornaria segur.</div>`:''}</div>${rs.map(r=>ratingEntry(r)).join('')}</section>`}
function ratingEntry(r){return `<article class="rating-entry"><div class="rating-head"><div><b>${esc(r.nom||'Valoració')}</b>${r.data?`<small>${esc(r.data)}</small>`:''}</div>${r.propia?'<span class="own-tag">Personal</span>':''}</div><div class="mini-ratings">${[['Menjar','menjar'],['Servei','servei'],['Local','local'],['Preu','preu']].map(([l,k])=>r[k]?`<span>${l}: ${stars(r[k])}</span>`:'').join('')}</div>${r.tornaria?`<div class="would-return">❤️ ${r.tornaria==='segur'?'Hi tornaria segur':r.tornaria==='sense_pressa'?'Hi tornaria, però sense pressa':'No hi tornaria'}</div>`:''}${r.comentari?`<p>${esc(r.comentari)}</p>`:''}</article>`}
function statusNotice(p){if(!p.estat||p.estat==='actiu')return '';const s=getStatus(p);return `<div class="status-notice status-${esc(p.estat)}"><b>${s.icon} ${s.label}</b>${p.dataBaixa?`<span>Des de ${esc(p.dataBaixa)}</span>`:''}${p.motiuBaixa?`<p>${esc(p.motiuBaixa)}</p>`:''}<small>La fitxa es conserva com a part de la biblioteca personal.</small></div>`}
function gallery(p){const imgs=uniq([p.imatge,...asArray(p.imatges)].filter(Boolean));if(imgs.length<=1)return '';return `<section class="detail-section"><h3>Galeria</h3><div class="gallery">${imgs.slice(1).map(x=>`<img src="${esc(x)}" alt="Fotografia de ${esc(p.nom)}" loading="lazy">`).join('')}</div></section>`}
function visits(p){if(!p.visites?.length)return '';return `<section class="detail-section"><h3>Visites</h3>${p.visites.map(v=>`<article class="visit"><b>${esc(v.data||'Visita')}</b>${v.ambQui?`<span>👥 ${esc(v.ambQui)}</span>`:''}${v.motiu?`<span>🎉 ${esc(v.motiu)}</span>`:''}${v.preuPersona?`<span>💶 ${esc(v.preuPersona)} € per persona</span>`:''}${v.comentari?`<p>${esc(v.comentari)}</p>`:''}</article>`).join('')}</section>`}
function showRecipe(p){const stats=[p.comensals?`👥 ${p.comensals} racions`:'',p.temps?`⏱️ ${p.temps} min`:'',p.coccio?`🔥 ${p.coccio} min cocció`:'',p.dificultat?`${p.dificultat==='Fàcil'?'💚':p.dificultat==='Mitjana'?'💜':'❤️'} ${p.dificultat}`:'',p.saludable==='✅'?'🥗 Saludable':''].filter(Boolean);return `<div class="eyebrow">👨‍🍳 Recepta · ${esc(p.categoria)}</div><h2>${esc(p.nom)}</h2><div class="loc">${esc([p.tipusAliment,p.cuina,p.cuiner&&`de ${p.cuiner}`].filter(Boolean).join(' · '))}</div><div class="recipe-stats">${stats.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>${p.narracio?`<div class="narrative">${esc(p.narracio)}</div>`:''}${p.restaurantRelacionat?`<div class="info"><small>Restaurant relacionat</small>🍴 ${esc(p.restaurantRelacionat)}</div>`:''}${p.ingredients?`<section class="detail-section"><h3>Ingredients</h3><div class="detail-text">${esc(p.ingredients)}</div></section>`:''}${p.preparacio?`<section class="detail-section"><h3>Preparació</h3><div class="detail-text">${esc(p.preparacio)}</div></section>`:''}${p.variacions?`<section class="detail-section"><h3>Variacions</h3><div class="detail-text">${esc(p.variacions)}</div></section>`:''}${p.allergens?.length?`<section class="detail-section"><h3>Al·lèrgens</h3><div class="recipe-stats">${p.allergens.map(x=>`<span class="chip">⚠️ ${esc(x)}</span>`).join('')}</div></section>`:''}${p.observacions?`<section class="detail-section"><h3>Observacions</h3><div class="detail-text">${esc(p.observacions)}</div></section>`:''}${p.enllac?`<a class="external-link" href="${esc(p.enllac)}" target="_blank" rel="noopener">Obrir l’enllaç ↗</a>`:''}`}
function showPlace(p){const categories=uniq([...(p.cuines||[]),...(p.categories||[])]);return `<div class="eyebrow">${icons[p.tipus]} ${esc(labels[p.tipus]?.[0]||p.tipus)}</div><h2>${esc(p.nom)}</h2><div class="loc">📍 ${esc(loc(p))}</div>${statusNotice(p)}${categories.length?`<div class="recipe-stats">${categories.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`:''}${p.adreca?`<div class="info"><small>Adreça</small>${esc(p.adreca)}</div>`:''}${p.horari?`<div class="info"><small>Horari</small>${esc(p.horari)}</div>`:''}${p.preuMitja?`<div class="info"><small>Preu aproximat</small>${esc(p.preuMitja)}</div>`:''}${p.notes?`<div class="info"><small>Notes</small>${esc(p.notes)}</div>`:''}${p.tipus==='restaurant'?ratingSummary(p):''}${visits(p)}${gallery(p)}`}
function showDetail(p){if(!p)return;const img=p.imatge||p.logo||p.imatges?.[0]||'';$('#heroimg').style.backgroundImage=img?`url('${img}')`:'none';$('#detailbody').innerHTML=p.tipus==='recepta'?showRecipe(p):showPlace(p);$('#detail').classList.add('open')}
$('#globalSearch').oninput=e=>{const q=e.target.value;$('#clear').classList.toggle('hidden',!q);$('#home').classList.remove('hidden');$('#moduleView').classList.add('hidden');globalSearch(q)};
$('#clear').onclick=()=>{$('#globalSearch').value='';$('#clear').classList.add('hidden');globalSearch('')};
$$('[data-module]').forEach(b=>b.onclick=()=>openModule(b.dataset.module));
$('#filterBtn').onclick=()=>$('#filters').classList.add('open');
$('#filters').onclick=e=>{if(e.target===$('#filters'))$('#filters').classList.remove('open')};
$('#region').onchange=()=>{filters.region=$('#region').value;filters.zone='';populateFilters()};
$('#apply').onclick=()=>{filters.region=$('#region').value;filters.zone=$('#zone').value;filters.cuisine=$('#cuisine').value;filters.specialty=$('#specialty').value;filters.status=$('#status').value;$('#filters').classList.remove('open');renderModule()};
$('#close').onclick=()=>$('#detail').classList.remove('open');
$('#detail').onclick=e=>{if(e.target===$('#detail'))$('#detail').classList.remove('open')};
$$('[data-nav]').forEach(b=>b.onclick=()=>{const n=b.dataset.nav;$$('[data-nav]').forEach(x=>x.classList.toggle('active',x===b));if(n==='home'){$('#home').classList.remove('hidden');$('#moduleView').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}if(n==='search'){$('#home').classList.remove('hidden');$('#moduleView').classList.add('hidden');$('#globalSearch').focus();window.scrollTo({top:0,behavior:'smooth'})}if(n==='favorites')alert('Els preferits comuns quedaran activats en una versió posterior.');if(n==='history')alert('L’historial quedarà activat en una versió posterior.')});
function setGreeting(){const h=new Date().getHours();let text='Bon dia!';if(h>=13&&h<20)text='Bona tarda!';else if(h>=20||h<6)text='Bona nit!';$('#greeting').textContent=text}
setGreeting();counts();

</script>
</body>
</html>
