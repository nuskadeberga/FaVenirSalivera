<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6efe6">
<meta name="description" content="Restaurants, receptes, vins, botigues i experiències que fan venir salivera.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>Fa venir Salivera · Biblioteca personal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="brand-left"><div class="mark">◡</div><div class="brand-name"><span class="brand-prefix">fa venir</span><strong>SALIVERA</strong><small>La teva biblioteca personal</small></div></div><button class="heart" aria-label="Preferits">♡</button></div>
 <div class="search"><span class="glass">⌕</span><input id="globalSearch" placeholder="Busca un lloc, un plat, un vi..."><button id="clear" class="x hidden">×</button></div>
</header>
<main>
 <section id="home">
  <div class="hero"><div class="eyebrow">Tot allò que val la pena recordar</div><h1 id="greeting">Bon dia!</h1><p>Què et ve de gust descobrir avui?</p></div>
  <div class="module-grid">
   <button class="module main" data-module="restaurant"><span class="icon">🍴</span><span><b>Restaurants</b><small>La teva col·lecció de restaurants</small></span><span class="go">→</span><span class="count" id="countRestaurant"></span></button>
   <button class="module" data-module="recepta"><span class="icon">👨‍🍳</span><b>Receptes</b><small>Què cuinar</small><span class="count" id="countRecepta"></span></button>
   <button class="module pending" data-module="vi"><span class="icon">🍷</span><b>Vins</b><small>DO catalanes</small><span class="count">—</span></button>
   <button class="module" data-module="botiga"><span class="icon">🛍️</span><b>Botigues</b><small>On comprar</small><span class="count" id="countBotiga"></span></button>
   <button class="module" data-module="experiencia"><span class="icon">✨</span><b>Experiències</b><small>Què descobrir</small><span class="count" id="countExperiencia"></span></button>
  </div>
  <div id="globalArea" class="hidden"><div class="section-title"><h2>Resultats globals</h2><small id="globalCount"></small></div><div id="globalResults" class="global-results"></div></div>
 </section>

 <section id="moduleView" class="view hidden">
  <div class="toolbar"><div><h2 id="moduleTitle"></h2><small id="moduleSubtitle"></small></div><button class="filter" id="filterBtn">☰ Filtres</button></div>
  <div id="cards" class="cards"></div>
 </section>
</main>
</div>
<nav class="bottom">
 <button class="active" data-nav="home"><span>⌂</span>Inici</button>
 <button data-nav="search"><span>⌕</span>Cercar</button>
 <button data-nav="favorites"><span>♡</span>Preferits</button>
 <button data-nav="history"><span>◷</span>Historial</button>
</nav>

<div class="overlay" id="filters">
 <div class="drawer"><div class="handle"></div><h2>Filtres</h2>
  <div class="fields">
   <div class="field"><label id="regionLabel">Vegueria</label><select id="region"><option value="">Totes</option></select></div>
   <div class="field"><label id="zoneLabel">Zona</label><select id="zone"><option value="">Totes</option></select></div>
   <div class="field" id="cuisineField"><label id="cuisineLabel">Cuina</label><select id="cuisine"><option value="">Totes</option></select></div>
   <div class="field"><label id="specialtyLabel">Tipus / especialitat</label><select id="specialty"><option value="">Totes</option></select></div>
   <div class="field" id="statusField"><label>Estat</label><select id="status"><option value="actiu">Només actius</option><option value="temporal">Tancats temporalment</option><option value="tancat">Tancats definitivament</option><option value="tots">Tots els estats</option></select></div>
  </div>
  <button class="apply" id="apply">Veure resultats</button>
 </div>
</div>

<div class="detail" id="detail"><article class="sheet"><div class="heroimg" id="heroimg"><button class="close" id="close">×</button></div><div class="detailbody" id="detailbody"></div></article></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
